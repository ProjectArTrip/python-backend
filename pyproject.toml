[project]
name = "arttripbackend"
version = "0.1.0"
description = ""


requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<2.1.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "firebase-admin (>=7.5.0,<8.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pyjwt[crypto] (>=2.15.1,<3.0.0)",
    "python-multipart (>=0.0.33,<0.0.34)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "defusedxml (>=0.7.1,<0.8.0)",
    "boto3 (>=1.44.2,<2.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "mypy-boto3-s3 (>=1.44.0,<2.0.0)",
]

[tool.poetry]
packages = [
    { include = "arttrip", from = "app" }
]
include = [{ path = "app/arttrip/py.typed", format = ["sdist", "wheel"] }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "ruff (>=0.16.7,<0.17.0)",
    "import-linter (>=2.15,<3.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "types-openpyxl (>=3.1.5.20261017,<4.0.0.0)",
    "boto3-stubs[s3] (>=1.44.1,<2.0.0)",
    "types-defusedxml (>=0.7.0.20260504,<0.8.0.0)"
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C90",
]
ignore = [
    "E501",
    "B008",
    "C901",
    "E402",
]
exclude = [
    ".git",
    "__pycache__",
    "tests/*"
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/arttrip/outbound/persistence/alembic/versions/*.py" = ["I001", "F401", "W291"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["firebase_admin.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "arttrip"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Common은 다른 어떤 계층도 모른다"
type = "forbidden"
source_modules = ["arttrip.common"]
forbidden_modules = [
    "arttrip.application",
    "arttrip.inbound",
    "arttrip.outbound",
]
broken_contract_guidance = """
smeem-common/build.gradle 에는 project 의존이 하나도 없다.
common 이 다른 계층을 보려 하면 그 코드는 common 이 아니다.
"""

[[tool.importlinter.contracts]]
name = "Inbound에서 Application 방향으로만 흐른다"
type = "layers"
layers = [
    "arttrip.inbound",
    "arttrip.application",
]

[[tool.importlinter.contracts]]
name = "Application은 어댑터와 프레임워크를 모른다"
type = "forbidden"
source_modules = ["arttrip.application"]
forbidden_modules = [
    "arttrip.inbound",
    "arttrip.outbound",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "psycopg",
    "pydantic",
    "pydantic_settings",
    "firebase_admin",
    "httpx",
    "redis",
    "uvicorn",
]
broken_contract_guidance = """
smeem-application/build.gradle 은 smeem-common 하나만 의존한다.
어댑터가 필요하면 application/port/output 에 포트를 정의하고 outbound 에서 구현해라.
"""

[[tool.importlinter.contracts]]
name = "Inbound와 Outbound는 서로 모른다"
type = "independence"
modules = [
    "arttrip.inbound",
    "arttrip.outbound",
]

[[tool.importlinter.contracts]]
name = "Outbound 어댑터끼리 서로 모른다"
type = "independence"
modules = [
    "arttrip.outbound.persistence",
    "arttrip.outbound.oauth",
]