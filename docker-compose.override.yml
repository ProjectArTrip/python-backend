services:

  app:
    container_name: arttrip-backend
    build:
      target: develop-stage
    ports:
      - ${HTTP_PORT:-8000}:8000
    volumes:
      - ./app:/app/app
      - ./secrets:/secrets:ro
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379

  postgres:
    image: postgres:18.1
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7.2
    container_name: redis
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
